name: Kínálat frissítése és közzététel

on:
  push:
    branches: [main]
  schedule:
    # Péntekenként a 9:00-s (budapesti) rendelési határidő előtt: fő futás 6:07/7:07, biztonsági 7:07/8:07 (tél/nyár).
    - cron: "7 5 * * 5"
    - cron: "7 6 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Debug
        continue-on-error: true
        run: node scripts/debug.mjs

      - name: Kínálat beolvasása az Interfoodról
        id: fetch
        continue-on-error: true
        run: node scripts/fetch-menu.mjs

      - name: Változás mentése
        if: steps.fetch.outcome == 'success'
        run: |
          if [ -n "$(git status --porcelain data/menu.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/menu.json
            git commit -m "Kínálat frissítése"
            git push
          fi

      - name: Oldal összeállítása
        run: |
          mkdir _site
          cp index.html robots.txt _site/
          cp -r data fonts _site/
          [ -f CNAME ] && cp CNAME _site/ || true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
