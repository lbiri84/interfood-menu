<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interfood heti válogatás</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  /* Elrendezés: színátmenetes háttér, áttetsző sötét panelek, széles betűközű cím, korall gombok.
     Szándékosan egyetlen, sötét megjelenés. */
  :root {
    --ink: #f7f2f5;
    --ink-dim: #cdc3d4;
    --panel: rgba(16, 11, 26, 0.7);
    --panel-solid: #16101f;
    --line: rgba(255, 255, 255, 0.14);
    --lavender: #9a9eff;
    --coral: #ff6b5e;
    --coral-ink: #1b0f1a;
    --orange: #f79a6b;
    --navy: #2a4a8f;
    --hover: rgba(255, 255, 255, 0.06);
    --checked: rgba(255, 107, 94, 0.2);
    --warn: #ffc27a;
    --display: "Bebas Neue", "Oswald", Impact, "Arial Narrow", sans-serif;
    --body: "Montserrat", -apple-system, "Segoe UI", system-ui, Roboto, sans-serif;
    --radius: 4px;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { background: #223f93; }
  body {
    margin: 0;
    padding: 36px 24px 130px;
    max-width: 1180px;
    margin-left: auto;
    margin-right: auto;
    background: transparent;
    color: var(--ink);
    font-family: var(--body);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background:
      radial-gradient(60% 45% at 80% 4%, rgba(255, 118, 125, 0.95), transparent 70%),
      radial-gradient(45% 42% at 18% 22%, rgba(250, 150, 108, 0.8), transparent 70%),
      radial-gradient(55% 55% at 6% 86%, rgba(28, 72, 176, 0.95), transparent 72%),
      radial-gradient(50% 50% at 96% 88%, rgba(44, 66, 170, 0.9), transparent 72%),
      linear-gradient(165deg, #e5607b 0%, #a3548e 42%, #23409a 100%);
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  header.page { margin-bottom: 28px; }
  .head-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px 32px;
    flex-wrap: wrap;
  }
  .head-text { min-width: 0; flex: 1 1 340px; }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink);
    font-weight: 600;
    margin: 0 0 10px;
  }
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(46px, 9vw, 92px);
    line-height: 0.98;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    margin: 0 0 18px;
    display: flex;
    flex-direction: column;
  }
  h1 .h1-a { color: var(--lavender); }
  h1 .h1-b { color: #fff; }
  .sub {
    color: var(--ink);
    font-size: 12.5px;
    line-height: 1.7;
    letter-spacing: 0.02em;
    margin: 0;
    max-width: 62ch;
    display: inline-block;
    padding: 10px 14px;
    background: rgba(16, 11, 26, 0.6);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-radius: var(--radius);
  }

  .refresh-box {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    flex: 0 1 auto;
  }
  .refresh-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  button.refresh, button.copy {
    background: var(--coral);
    color: var(--coral-ink);
    border: none;
    border-radius: var(--radius);
    padding: 12px 20px;
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  button.refresh:hover:not(:disabled), button.copy:not(:disabled):hover { background: #ff8174; }
  button.refresh:disabled { opacity: 0.65; cursor: progress; }
  button.copy:disabled { opacity: 0.4; cursor: not-allowed; }
  button.refresh:focus-visible, button.copy:focus-visible, button.clear:focus-visible,
  .day-tab:focus-visible, .refresh-box select:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  button.refresh svg { flex: none; }
  button.refresh.busy svg { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .refresh-box select {
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--ink);
    background: rgba(16, 11, 26, 0.55);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 11px 12px;
    min-width: 0;
  }
  .refresh-box select option { background: var(--panel-solid); color: var(--ink); }
  .status {
    margin: 0;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--ink);
    max-width: 44ch;
    text-align: right;
    font-variant-numeric: tabular-nums;
    padding: 6px 10px;
    background: rgba(16, 11, 26, 0.6);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border-radius: var(--radius);
  }
  .status:empty { display: none; }
  .status.error { color: var(--warn); }
  @media (max-width: 640px) {
    body { padding-left: 16px; padding-right: 16px; }
    .refresh-box { align-items: stretch; width: 100%; }
    .refresh-actions { flex-wrap: nowrap; }
    .refresh-actions select { flex: 1 1 auto; }
    button.refresh { justify-content: center; }
    .status { text-align: left; max-width: none; }
  }

  #days {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--panel);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    overflow-x: auto;
    overflow-y: hidden;
  }
  .table-wrap { min-width: 640px; }

  .col-heads, .cat-rows {
    display: grid;
    grid-template-columns: repeat(3, minmax(210px, 1fr));
  }
  .col-head {
    padding: 14px 18px 12px;
    border-right: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 12px;
  }
  .col-head:last-child { border-right: none; }
  h2 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 26px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin: 0;
    line-height: 1;
  }
  .col-head .date, .mobile-day-head .date {
    display: block;
    margin-top: 6px;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
  }
  .day-num {
    font-weight: 200;
    font-size: 54px;
    line-height: 0.85;
    letter-spacing: 0.02em;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }

  .cat-label {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 18px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.07);
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .cat-label::before {
    content: "";
    width: 18px;
    height: 2px;
    background: var(--orange);
    flex: none;
  }

  .day-col { border-right: 1px solid var(--line); }
  .day-col:last-child { border-right: none; }

  .day-tabs {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-bottom: 1px solid var(--line);
  }
  .day-tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    border-radius: var(--radius);
    padding: 9px 6px;
    font: inherit;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .day-tab .tab-date { font-size: 10.5px; font-weight: 500; letter-spacing: 0.06em; color: var(--ink-dim); }
  .day-tab.active { background: var(--coral); border-color: var(--coral); color: var(--coral-ink); }
  .day-tab.active .tab-date { color: var(--coral-ink); }

  .mobile-day-head {
    padding: 14px 18px 12px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
  }

  .food-row {
    display: grid;
    grid-template-columns: 44px 58px 1fr;
    gap: 10px;
    align-items: start;
    padding: 11px 18px 11px 14px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .food-row:last-child { border-bottom: none; }
  .food-row:hover { background: var(--hover); }
  .food-row.checked { background: var(--checked); }

  .tick-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-variant-numeric: tabular-nums;
  }
  .tick-col .price { font-size: 10.5px; color: var(--ink-dim); white-space: nowrap; }

  input.chk {
    appearance: none;
    width: 18px;
    height: 18px;
    border: 1.5px solid var(--ink-dim);
    border-radius: 3px;
    display: grid;
    place-content: center;
    cursor: pointer;
    background: transparent;
    flex: none;
    margin: 0;
  }
  input.chk::after {
    content: "";
    width: 9px;
    height: 9px;
    clip-path: polygon(14% 44%, 0 65%, 36% 100%, 100% 20%, 82% 4%, 34% 72%);
    background: transparent;
    transform: scale(0.9);
  }
  input.chk:checked { background: var(--coral); border-color: var(--coral); }
  input.chk:checked::after { background: var(--coral-ink); }
  input.chk:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .code-col {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 4px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .code {
    font-family: var(--body);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #ffc2b5;
    border: 1px solid rgba(255, 140, 120, 0.7);
    border-radius: 3px;
    padding: 3px 4px;
    text-align: center;
  }
  .kcal { font-size: 11.5px; font-weight: 600; color: var(--lavender); }
  .kcal.none { color: var(--ink-dim); font-weight: 400; }

  .name-wrap { min-width: 0; }
  .name { font-size: 13.5px; line-height: 1.45; font-weight: 500; }

  .empty-note { padding: 12px 18px; font-size: 12.5px; color: var(--ink-dim); font-style: italic; }
  .loading-note { padding: 28px 18px; color: var(--ink-dim); font-size: 13px; margin: 0; }
  .loading-note.error { color: var(--warn); }

  footer.bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: rgba(16, 11, 26, 0.82);
    -webkit-backdrop-filter: blur(14px);
    backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    padding: 12px 24px calc(12px + env(safe-area-inset-bottom));
  }
  .bar-inner {
    max-width: 1132px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .count { font-size: 12.5px; color: var(--ink-dim); flex: 1; letter-spacing: 0.04em; }
  .count strong { color: var(--ink); font-size: 16px; font-variant-numeric: tabular-nums; }
  button.clear {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 12px 16px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
  }
  button.clear:hover { border-color: var(--ink); }

  .preview {
    max-width: 1132px;
    margin: 8px auto 0;
    font-size: 11.5px;
    color: var(--ink-dim);
    display: none;
  }
  .preview.show { display: block; }
  .preview textarea {
    width: 100%;
    resize: none;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 12.5px;
    background: rgba(0, 0, 0, 0.35);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 8px 10px;
    margin-top: 4px;
  }
  @media (max-width: 640px) {
    footer.bar { padding-left: 16px; padding-right: 16px; }
    button.copy, button.clear { padding-left: 14px; padding-right: 14px; }
  }
</style>
</head>
<body>

<header class="page">
  <div class="head-row">
    <div class="head-text">
      <p class="eyebrow" id="eyebrow">Heti ebédrendelés</p>
      <h1><span class="h1-a">Interfood</span><span class="h1-b">Válogatás</span></h1>
    </div>
    <div class="refresh-box">
      <div class="refresh-actions">
        <select id="weekSel" aria-label="Hét kiválasztása" hidden></select>
      </div>
      <p class="status" id="status" role="status"></p>
    </div>
  </div>
</header>

<main id="days"><p class="loading-note" id="loadNote">A kínálat betöltése…</p></main>

<footer class="bar">
  <div class="bar-inner">
    <div class="count"><strong id="countNum">0</strong> étel kiválasztva</div>
    <button class="clear" id="clearBtn" type="button">Törlés</button>
    <button class="copy" id="copyBtn" type="button" disabled>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      Vágólapra másolás
    </button>
  </div>
  <div class="preview" id="preview">
    <span id="previewLabel">Másolva:</span>
    <textarea id="previewText" rows="3" readonly></textarea>
  </div>
</footer>

<script>
  var DATA_URL = "data/menu.json";

  var DAYS = [];
  var ITEMS = [];
  var WEEKS = [];
  var weekIdx = 0;

  var CATEGORY_ORDER = ["Extra", "Levesek", "Főételek", "Főzelékek"];

  function groupFor(code) {
    if (code === "SP1" || code === "DKM" || code === "KM") return "Extra";
    if (code === "L1K" || code === "L2K" || code === "L3K") return "Levesek";
    if (code.charAt(0) === "F") return "Főzelékek";
    return "Főételek";
  }

  var daysEl0 = document.getElementById("days");
  var daysEl = daysEl0;
  var mobileQuery = window.matchMedia("(max-width: 780px)");
  var selected = new Set(); // keys: "<dayKey>::<code>"
  var activeDay = "";
  var rowIndex = 0;

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
    });
  }

  function dayNum(date) {
    var p = String(date).split(".");
    return p.length > 2 ? String(Number(p[2])) : "";
  }

  function isMobile() {
    return mobileQuery.matches;
  }

  function buildFoodRow(it, day) {
    var row = document.createElement("label");
    row.className = "food-row";
    var id = "chk-" + (rowIndex++);
    var checkedAttr = selected.has(day.key + "::" + it.code) ? " checked" : "";

    var kcalHtml = it.kcal
      ? "<div class=\"kcal\">" + esc(it.kcal) + " kcal</div>"
      : "<div class=\"kcal none\">nincs adat</div>";

    row.innerHTML =
      "<span class=\"tick-col\"><input class=\"chk\" type=\"checkbox\"" + checkedAttr + " id=\"" + id + "\" data-code=\"" + esc(it.code) + "\" data-day=\"" + esc(day.key) + "\" data-daylabel=\"" + esc(day.label) + "\"><span class=\"price\">" + esc(it.price) + "</span></span>" +
      "<span class=\"code-col\"><span class=\"code\">" + esc(it.code) + "</span>" + kcalHtml + "</span>" +
      "<span class=\"name-wrap\"><span class=\"name\">" + esc(it.name) + "</span></span>";

    return row;
  }

  function buildTable() {
    var wrap = document.createElement("div");
    wrap.className = "table-wrap";

    var colHeads = document.createElement("div");
    colHeads.className = "col-heads";
    DAYS.forEach(function (day) {
      var col = document.createElement("div");
      col.className = "col-head";
      col.innerHTML = "<div><h2>" + esc(day.label) + "</h2><span class=\"date\">" + esc(day.date) + "</span></div><span class=\"day-num\">" + esc(dayNum(day.date)) + "</span>";
      colHeads.appendChild(col);
    });
    wrap.appendChild(colHeads);

    CATEGORY_ORDER.forEach(function (groupName) {
      var anyInGroup = ITEMS.some(function (it) { return it.name && groupFor(it.code) === groupName; });
      if (!anyInGroup) return;

      var catLabel = document.createElement("div");
      catLabel.className = "cat-label";
      catLabel.textContent = groupName;
      wrap.appendChild(catLabel);

      var catRows = document.createElement("div");
      catRows.className = "cat-rows";

      DAYS.forEach(function (day) {
        var dayCol = document.createElement("div");
        dayCol.className = "day-col";

        var rows = ITEMS.filter(function (it) {
          return it.day === day.key && it.name && groupFor(it.code) === groupName;
        });

        if (!rows.length) {
          var note = document.createElement("div");
          note.className = "empty-note";
          note.textContent = "Nincs elérhető tétel.";
          dayCol.appendChild(note);
        } else {
          rows.forEach(function (it) {
            dayCol.appendChild(buildFoodRow(it, day));
          });
        }

        catRows.appendChild(dayCol);
      });

      wrap.appendChild(catRows);
    });

    daysEl.appendChild(wrap);
  }

  function buildMobile() {
    var tabs = document.createElement("div");
    tabs.className = "day-tabs";
    DAYS.forEach(function (day) {
      var tab = document.createElement("button");
      tab.type = "button";
      tab.className = "day-tab" + (day.key === activeDay ? " active" : "");
      tab.innerHTML = esc(day.label) + "<span class=\"tab-date\">" + esc(day.date.slice(5)) + "</span>";
      tab.addEventListener("click", function () {
        activeDay = day.key;
        renderDays();
      });
      tabs.appendChild(tab);
    });
    daysEl.appendChild(tabs);

    var day = DAYS.filter(function (d) { return d.key === activeDay; })[0] || DAYS[0];

    var head = document.createElement("div");
    head.className = "mobile-day-head";
    head.innerHTML = "<div><h2>" + esc(day.label) + "</h2><span class=\"date\">" + esc(day.date) + "</span></div><span class=\"day-num\">" + esc(dayNum(day.date)) + "</span>";
    daysEl.appendChild(head);

    CATEGORY_ORDER.forEach(function (groupName) {
      var rows = ITEMS.filter(function (it) {
        return it.day === day.key && it.name && groupFor(it.code) === groupName;
      });
      if (!rows.length) return;

      var catLabel = document.createElement("div");
      catLabel.className = "cat-label";
      catLabel.textContent = groupName;
      daysEl.appendChild(catLabel);

      rows.forEach(function (it) {
        daysEl.appendChild(buildFoodRow(it, day));
      });
    });
  }

  function renderDays() {
    if (!DAYS.length) return;
    daysEl.innerHTML = "";
    rowIndex = 0;
    if (isMobile()) buildMobile(); else buildTable();
    refresh();
  }

  if (mobileQuery.addEventListener) {
    mobileQuery.addEventListener("change", renderDays);
  } else if (mobileQuery.addListener) {
    mobileQuery.addListener(renderDays);
  }

  var countNum = document.getElementById("countNum");
  var copyBtn = document.getElementById("copyBtn");
  var clearBtn = document.getElementById("clearBtn");
  var preview = document.getElementById("preview");
  var previewText = document.getElementById("previewText");

  function refresh() {
    countNum.textContent = selected.size;
    copyBtn.disabled = selected.size === 0;
    Array.prototype.slice.call(document.querySelectorAll(".chk")).forEach(function (c) {
      var isChecked = selected.has(c.dataset.day + "::" + c.dataset.code);
      c.checked = isChecked;
      c.closest(".food-row").classList.toggle("checked", isChecked);
    });
  }

  daysEl.addEventListener("change", function (e) {
    if (!e.target.classList.contains("chk")) return;
    var key = e.target.dataset.day + "::" + e.target.dataset.code;
    if (e.target.checked) selected.add(key); else selected.delete(key);
    refresh();
  });

  clearBtn.addEventListener("click", function () {
    selected.clear();
    refresh();
    preview.classList.remove("show");
  });

  function buildClipboardText() {
    var lines = [];
    DAYS.forEach(function (d) {
      var codes = [];
      ITEMS.forEach(function (it) {
        if (it.day === d.key && it.name && selected.has(d.key + "::" + it.code)) codes.push(it.code);
      });
      if (codes.length) lines.push(d.label + ": " + codes.join(", "));
    });
    return lines.join("\n");
  }

  copyBtn.addEventListener("click", function () {
    var text = buildClipboardText();
    if (!text) return;
    previewText.value = text;
    preview.classList.add("show");

    function fallback() {
      previewText.focus();
      previewText.select();
      try { document.execCommand("copy"); } catch (err) {}
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        copyBtn.textContent = "";
        var icon = document.createElement("span");
        icon.textContent = "Másolva ✓";
        copyBtn.appendChild(icon);
        setTimeout(function () {
          copyBtn.innerHTML = "<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><rect x=\"9\" y=\"9\" width=\"11\" height=\"11\" rx=\"2\"/><path d=\"M5 15V5a2 2 0 0 1 2-2h10\"/></svg> Vágólapra másolás";
        }, 1600);
      }).catch(fallback);
    } else {
      fallback();
    }
  });


  /* ---------- Adatok betöltése ---------- */

  var statusEl = document.getElementById("status");
  var eyebrowEl = document.getElementById("eyebrow");
  var weekSel = document.getElementById("weekSel");
  var fetchedLabel = "";

  function setStatus(text, isError) {
    statusEl.textContent = text || "";
    statusEl.classList.toggle("error", !!isError);
  }

  function fmtFetched(iso) {
    try {
      return new Date(iso).toLocaleString("hu-HU", {
        timeZone: "Europe/Budapest", year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit"
      });
    } catch (e) { return iso; }
  }

  function applyWeek(idx) {
    var w = WEEKS[idx];
    weekIdx = idx;
    DAYS = w.days;
    ITEMS = w.items;
    activeDay = DAYS[0].key;
    var valid = new Set();
    ITEMS.forEach(function (it) { valid.add(it.day + "::" + it.code); });
    Array.from(selected).forEach(function (k) { if (!valid.has(k)) selected.delete(k); });
    eyebrowEl.textContent = w.week + ". hét · " + w.range;
    renderDays();
  }

  function fillWeekSelect() {
    weekSel.innerHTML = "";
    WEEKS.forEach(function (w, i) {
      var o = document.createElement("option");
      o.value = String(i);
      o.textContent = w.week + ". hét (" + w.range.replace(/^\d{4}\./, "") + ")";
      weekSel.appendChild(o);
    });
    weekSel.value = String(weekIdx);
    weekSel.hidden = WEEKS.length < 2;
  }

  async function loadData(manual) {
    try {
      var res = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var data = await res.json();
      if (!data || !Array.isArray(data.weeks) || !data.weeks.length) throw new Error("üres adat");
      var keepWeek = WEEKS.length ? WEEKS[weekIdx] : null;
      WEEKS = data.weeks;
      var idx = 0;
      if (keepWeek) {
        WEEKS.forEach(function (w, i) { if (w.year === keepWeek.year && w.week === keepWeek.week) idx = i; });
      } else if (data.currentWeek) {
        WEEKS.forEach(function (w, i) { if (w.year === Number(data.currentWeek.year) && w.week === Number(data.currentWeek.week)) idx = i; });
      }
      fetchedLabel = data.fetchedAt ? fmtFetched(data.fetchedAt) : "";
      fillWeekSelect();
      weekSel.value = String(idx);
      applyWeek(idx);
      setStatus(fetchedLabel ? "A kínálat utoljára ekkor változott: " + fetchedLabel : "", false);
    } catch (e) {
      if (!WEEKS.length) {
        daysEl.innerHTML = "<p class=\"loading-note error\">A kínálat betöltése nem sikerült. Töltsd újra az oldalt.</p>";
      }
      setStatus("Az adatok betöltése nem sikerült.", true);
    }
  }

  weekSel.addEventListener("change", function () { applyWeek(Number(weekSel.value)); });

  loadData(false);
</script>
</body>
</html>
